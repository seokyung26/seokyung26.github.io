# ---- Site settings (GitHub Pages / Jekyll) ----
title: Seokyung Park
description: M.S. student, Precision Agriculture and Smart Sensing System (PASS) Lab, Pusan National University. Agricultural robotics, field sensing, and structural analysis.
author: Seokyung Park
email: seokyung.park@pusan.ac.kr
